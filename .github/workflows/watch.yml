name: Weekly publication watch
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  orcid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Open or update one issue when ORCID lists a work the site lacks
        run: python watch_orcid.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
